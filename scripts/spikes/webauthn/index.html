<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebAuthn-Spike</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1c1c1a; --muted:#6b6b66; --line:#ddddd8; --ok:#1f7a3f; --bad:#b42318; --accent:#2f5bd3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ececea; --muted:#9a9a94; --line:#33332f; --ok:#4cc27a; --bad:#ff7b6b; --accent:#7d9cff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:20px; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 20px; }
  .card { border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:12px 0; }
  .card h2 { font-size:15px; margin:0 0 6px; } .card p { margin:0 0 10px; color:var(--muted); font-size:13px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; margin:4px 6px 0 0; }
  button.secondary { background:transparent; color:var(--accent); }
  pre { background:transparent; border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; overflow:auto; max-height:320px; white-space:pre-wrap; word-break:break-word; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  code { font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>WebAuthn-Spike</h1>
  <p class="sub">Adresse: <code id="origin"></code> · Client: <code id="client"></code></p>

  <div class="card">
    <h2>1 · Passkey registrieren</h2>
    <p>Windows Hello (PIN/Fingerabdruck/Gesicht) — oder im Dialog „Anderes Gerät / Handy“ für Test 3 wählen.</p>
    <button id="reg">Passkey registrieren</button>
  </div>

  <div class="card">
    <h2>2 · Anmelden (mit PRF)</h2>
    <p>Bitte zweimal anmelden — der PRF-Fingerabdruck muss beide Male gleich sein.</p>
    <button id="auth">Anmelden</button>
    <button id="authLocalhost" class="secondary">Anmelden mit rpId „localhost“ (Test auf 127.0.0.1)</button>
  </div>

  <div class="card">
    <h2>Ergebnis</h2>
    <pre id="out"></pre>
  </div>
</main>
<script>
const params = new URLSearchParams(location.search);
const client = params.get("client") || (window.chrome && window.chrome.webview ? "webview2" : "browser");
document.getElementById("origin").textContent = location.origin;
document.getElementById("client").textContent = client;
const out = document.getElementById("out");

function show(line, cls) {
  const span = document.createElement("div");
  if (cls) span.className = cls;
  span.textContent = `${new Date().toLocaleTimeString("de-DE")}  ${line}`;
  out.prepend(span);
}

const b64urlToBuf = (s) => {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const bin = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(bin, (c) => c.charCodeAt(0)).buffer;
};
const bufToB64url = (buf) =>
  btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function sha256Hex(buf) {
  const digest = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

let SALT;
async function salt() {
  SALT ??= await crypto.subtle.digest("SHA-256", new TextEncoder().encode("aktenraum-prf-spike-v1"));
  return SALT;
}

async function post(path, payload) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  const json = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(json.error || `${r.status}`);
  return json;
}
const logClient = (payload) => post("/api/log", { client, ...payload }).catch(() => {});

function credentialToJSON(cred) {
  const r = cred.response;
  const json = {
    id: cred.id,
    rawId: bufToB64url(cred.rawId),
    type: cred.type,
    authenticatorAttachment: cred.authenticatorAttachment ?? undefined,
    clientExtensionResults: {},
    response: { clientDataJSON: bufToB64url(r.clientDataJSON) },
  };
  if (r.attestationObject) {
    json.response.attestationObject = bufToB64url(r.attestationObject);
    json.response.transports = r.getTransports ? r.getTransports() : [];
  } else {
    json.response.authenticatorData = bufToB64url(r.authenticatorData);
    json.response.signature = bufToB64url(r.signature);
    if (r.userHandle) json.response.userHandle = bufToB64url(r.userHandle);
  }
  return json;
}

async function prfSummary(ext) {
  const prf = ext && ext.prf;
  if (!prf) return { supported: false };
  const first = prf.results && prf.results.first;
  return {
    supported: true,
    enabled: prf.enabled ?? null,
    output: first ? { bytes: first.byteLength, fingerprint: (await sha256Hex(first)).slice(0, 16) } : null,
  };
}

function describeError(e) {
  return { name: e && e.name, message: e && e.message };
}

async function register() {
  try {
    const options = await post("/api/reg/options", { client });
    const publicKey = {
      ...options,
      challenge: b64urlToBuf(options.challenge),
      user: { ...options.user, id: b64urlToBuf(options.user.id) },
      excludeCredentials: [],
      extensions: { credProps: true, prf: { eval: { first: await salt() } } },
    };
    const cred = await navigator.credentials.create({ publicKey });
    const ext = cred.getClientExtensionResults();
    const prf = await prfSummary(ext);
    const result = await post("/api/reg/verify", { credential: credentialToJSON(cred), challenge: options.challenge, client, prf });
    show(`Registriert: ${result.credential.authenticator} · ${result.credential.attachment ?? "?"} · PRF ${JSON.stringify(prf)}`, "ok");
  } catch (e) {
    show(`Registrierung fehlgeschlagen: ${e.name || ""} ${e.message}`, "bad");
    logClient({ type: "register-error", error: describeError(e) });
  }
}

async function authenticate(rpIdOverride) {
  try {
    const options = await post("/api/auth/options", { client, rpId: rpIdOverride });
    const publicKey = {
      ...options,
      challenge: b64urlToBuf(options.challenge),
      allowCredentials: [],
      extensions: { prf: { eval: { first: await salt() } } },
    };
    const cred = await navigator.credentials.get({ publicKey });
    const prf = await prfSummary(cred.getClientExtensionResults());
    const result = await post("/api/auth/verify", { credential: credentialToJSON(cred), challenge: options.challenge, client, prf });
    show(`Angemeldet (${result.authenticator}) · PRF ${JSON.stringify(prf)}`, result.ok ? "ok" : "bad");
  } catch (e) {
    show(`Anmeldung fehlgeschlagen${rpIdOverride ? ` (rpId=${rpIdOverride})` : ""}: ${e.name || ""} ${e.message}`, "bad");
    logClient({ type: "authenticate-error", rpIdOverride: rpIdOverride ?? null, error: describeError(e) });
  }
}

document.getElementById("reg").onclick = register;
document.getElementById("auth").onclick = () => authenticate();
document.getElementById("authLocalhost").onclick = () => authenticate("localhost");

(async () => {
  const env = {
    type: "environment",
    secureContext: window.isSecureContext,
    publicKeyCredential: typeof PublicKeyCredential !== "undefined",
    userAgent: navigator.userAgent,
  };
  if (env.publicKeyCredential) {
    try { env.platformAuthenticator = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch (e) { env.platformAuthenticator = describeError(e); }
    try { env.conditionalMediation = await PublicKeyCredential.isConditionalMediationAvailable?.(); } catch {}
    try { env.clientCapabilities = await PublicKeyCredential.getClientCapabilities?.(); } catch (e) { env.clientCapabilities = describeError(e); }
  }
  show(`Umgebung: ${JSON.stringify(env)}`);
  logClient(env);
})();
</script>
</body>
</html>
