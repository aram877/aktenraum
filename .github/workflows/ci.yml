name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight CI on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint + build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint

      - name: Build
        run: pnpm -r build

      - name: Typecheck tests
        run: pnpm --filter @aktenraum/api typecheck

      - name: Typecheck SPA
        run: pnpm --filter @aktenraum/web typecheck

      - name: Test
        run: pnpm -r test

  images:
    name: docker images + compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate compose files
        env:
          AKTENRAUM_DATA_DIR: /tmp/aktenraum
          PAPERLESS_DBPASS: ci
        run: |
          cp docker/.env.example docker/.env
          docker compose --project-directory docker -f docker/docker-compose.yml config -q
          docker compose --project-directory docker -f docker/docker-compose.yml -f docker/docker-compose.dev.yml config -q

      - name: Build images
        run: |
          for spec in services/aktenraum-api/Dockerfile:aktenraum-api services/auto-tagger/Dockerfile:auto-tagger docker/nginx/Dockerfile:nginx docker/backup/Dockerfile:backup; do
            file="${spec%%:*}"
            name="${spec##*:}"
            context=.
            if [ "$name" = backup ]; then context=docker/backup; fi
            docker build --load -f "$file" -t "aktenraum-$name:ci" "$context"
          done

      - name: nginx config syntax
        run: docker run --rm aktenraum-nginx:ci nginx -t
