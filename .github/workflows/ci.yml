name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight CI on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint + build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm -r lint

      - name: Build
        run: pnpm -r build

      - name: Typecheck tests
        run: pnpm --filter @aktenraum/api typecheck

      - name: Typecheck SPA
        run: pnpm --filter @aktenraum/web typecheck

      - name: Test
        run: pnpm -r test
