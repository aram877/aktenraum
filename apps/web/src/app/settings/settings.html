<div class="flex min-h-full flex-col">
  <main class="flex-1 px-6 py-10">
    <div class="mx-auto flex max-w-2xl flex-col gap-10">
      <h1 class="text-lg font-semibold tracking-tight text-ink">Einstellungen</h1>

      <app-model-picker
        title="Modell für Klassifizierung"
        description="Wird für die Extraktion der ai_* Felder beim Hochladen verwendet."
        fieldName="tagger-model"
        [activeModel]="tagger.data()?.model ?? null"
        [availableModels]="models.data() ?? []"
        [isModelsLoading]="models.isPending()"
        [isPending]="updateTagger.isPending()"
        [pending]="pendingTagger()"
        (pick)="onPickTagger($event)"
      />

      <app-model-picker
        title="Modell für Antworten"
        description="Wird für die Prosa-Antworten auf der Ask-Seite verwendet."
        fieldName="answer-model"
        [activeModel]="answer.data()?.model ?? null"
        [availableModels]="models.data() ?? []"
        [isModelsLoading]="models.isPending()"
        [isPending]="updateAnswer.isPending()"
        [pending]="pendingAnswer()"
        (pick)="onPickAnswer($event)"
      />

      <app-auto-approve />

      <app-konto />
    </div>
  </main>
</div>
