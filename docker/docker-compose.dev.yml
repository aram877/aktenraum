# Dev overlay — applied on top of docker-compose.yml via:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# (or `task dev:up` for the friendly form).
#
# What this changes vs prod:
#   - both Node services get the repo bind-mounted and run `tsx watch`
#     instead of the compiled `dist/`, so a .ts save on the host restarts
#     the process in about a second with no image rebuild.
#
# Why this lives in a separate file:
#   - The prod compose stays clean — no dev-only entrypoints in the
#     image-bake path.
#   - Both files are checked into git so any machine with a checkout can
#     switch into dev mode with one command.
#
# Caveats:
#   - node_modules stay the ones baked into the image (the bind mounts
#     are scoped to src/), so adding a dependency still needs a rebuild.
#   - The schema bootstrap re-runs on every container restart, not on
#     every hot reload. It is idempotent, so that is a no-op.

services:
  aktenraum-api:
    volumes:
      - ../services/aktenraum-api/src:/repo/services/aktenraum-api/src:ro
      - ../packages/aktenraum-core/src:/repo/packages/aktenraum-core/src:ro
      - ../evals:/repo/evals:ro
      - aktenraum-node-hf-cache:/home/appuser/.cache/huggingface
    command:
      - /repo/node_modules/.bin/tsx
      - watch
      - src/main.ts

  auto-tagger:
    volumes:
      - ../services/auto-tagger/src:/repo/services/auto-tagger/src:ro
      - ../packages/aktenraum-core/src:/repo/packages/aktenraum-core/src:ro
    command:
      - /repo/node_modules/.bin/tsx
      - watch
      - src/main.ts
