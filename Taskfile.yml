version: "3"

silent: true

vars:
  PNPM:
    sh: command -v pnpm >/dev/null 2>&1 && echo pnpm || echo 'corepack pnpm'
  COMPOSE: docker compose --project-directory docker

tasks:
  default:
    cmds:
      - task --list

  start:
    desc: "Start the stack — picks up where you left off and applies docker/.env changes"
    cmds:
      - "{{.COMPOSE}} up -d"
      - 'echo "✓ aktenraum is starting. Give it ~30s, then open http://localhost:8080"'

  stop:
    desc: "Stop the stack — your data is kept"
    cmds:
      - "{{.COMPOSE}} down"
      - 'echo "✓ aktenraum stopped. Run task start to bring it back."'

  status:
    desc: "Show which services are running and whether they are healthy"
    cmds:
      - "{{.COMPOSE}} ps"

  logs:
    desc: "Tail logs. SVC=<service> for one service, omit for all"
    cmds:
      - |
        if [ -n "{{.SVC}}" ]; then
          {{.COMPOSE}} logs -f --tail=200 {{.SVC}}
        else
          {{.COMPOSE}} logs -f --tail=100
        fi

  build:
    desc: "Rebuild and restart the SPA (nginx) and both Node services after a code change"
    cmds:
      - "{{.COMPOSE}} up -d --build nginx auto-tagger aktenraum-api"
      - 'echo "✓ Rebuilt. Open http://localhost:8080"'

  web:dev:
    desc: "Nuxt dev server on :4300 (proxies /api to the running stack on :8080)"
    deps: [install]
    cmds:
      - "{{.PNPM}} --filter @aktenraum/web dev"

  test:
    desc: "Run every package's tests"
    deps: [install]
    cmds:
      - "{{.PNPM}} -r test"

  lint:
    desc: "Run ESLint in every package"
    deps: [install]
    cmds:
      - "{{.PNPM}} -r lint"

  install:
    internal: true
    cmds:
      - "{{.PNPM}} install"

  setup:
    desc: "First-time setup — secrets, stack, Paperless token + fields, backup repo, first snapshot"
    cmds:
      - bash scripts/setup.sh
      - bash scripts/bootstrap-secrets.sh
      - "{{.COMPOSE}} up -d"
      - bash scripts/fix-token.sh
      - |
        TOKEN=$(grep '^PAPERLESS_API_TOKEN=' docker/.env | cut -d= -f2-)
        docker cp scripts/bootstrap-paperless.sh docker-paperless-1:/tmp/bootstrap-paperless.sh
        {{.COMPOSE}} exec -T -e PAPERLESS_API_TOKEN="$TOKEN" paperless bash /tmp/bootstrap-paperless.sh
      - |
        {{.COMPOSE}} exec -T backup sh -c \
          'restic -r /repo snapshots > /dev/null 2>&1 || restic -r /repo init'
      - MSYS_NO_PATHCONV=1 {{.COMPOSE}} exec backup //usr/local/bin/entrypoint.sh
      - |
        echo ""
        echo "✓ aktenraum is ready: http://localhost:8080"
        echo "  Your login password was printed above by bootstrap-secrets. Write it down — it is not shown again."

  recover:
    desc: "Fix 401 / 'API rejected' errors after a database wipe — re-mints the Paperless token"
    cmds:
      - bash scripts/fix-token.sh

  destroy:
    desc: "DANGER — delete ALL data (documents, databases, backups) in AKTENRAUM_DATA_DIR"
    interactive: true
    cmds:
      - |
        DATA_DIR=$(grep '^AKTENRAUM_DATA_DIR=' docker/.env 2>/dev/null | cut -d= -f2- || true)
        if [ -z "$DATA_DIR" ]; then
          echo "ERROR: AKTENRAUM_DATA_DIR not found in docker/.env. Delete your data folder manually, then run task setup." >&2
          exit 1
        fi
        echo ""
        echo "WARNING: this permanently deletes every document, both databases and all backups in:"
        echo "  $DATA_DIR"
        echo "There is NO undo."
        printf 'Type DELETE to confirm, or press Enter to cancel: '
        read confirm
        if [ "$confirm" != "DELETE" ]; then
          echo "Cancelled."
          exit 0
        fi
        {{.COMPOSE}} down
        rm -rf "$DATA_DIR"
        echo "✓ Data wiped. Run task setup to start fresh."

  rag:reembed:
    desc: "Rebuild the search index after changing the embedding model (Paperless documents are untouched)"
    prompt: "This deletes the Qdrant vector index and re-embeds every document. Ask is degraded until it finishes. Continue?"
    cmds:
      - "MSYS_NO_PATHCONV=1 {{.COMPOSE}} exec -T auto-tagger node dist/drop-collection.js"
      - echo "Re-embedding every document (this can take a while)..."
      - bash scripts/backfill-rag-index.sh --force

  backup:verify:
    desc: "Check the backups can actually be restored (non-destructive: restic check + test restore + both DB dumps)"
    cmds:
      - MSYS_NO_PATHCONV=1 {{.COMPOSE}} exec -e RESTIC_REPOSITORY=/repo backup //usr/local/bin/verify-backup.sh
