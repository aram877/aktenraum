services:

  paperless:
    # Pinned to the version actually deployed (verified via
    # paperless.version.__version__ at change time). Bump deliberately,
    # never by accident: floating :latest hid this behaviour for months.
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15@sha256:6c86cad803970ea782683a8e80e7403444c5bf3cf70de63b4d3c8e87500db92f
    mem_limit: ${PAPERLESS_MEM_LIMIT:-4g}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${AKTENRAUM_DATA_DIR:?must be set to an absolute path in docker/.env (see .env.example) - unset/empty risks silent data loss}/data:/usr/src/paperless/data
      - ${AKTENRAUM_DATA_DIR:?must be set to an absolute path in docker/.env (see .env.example) - unset/empty risks silent data loss}/media:/usr/src/paperless/media
      - ${AKTENRAUM_DATA_DIR:?must be set to an absolute path in docker/.env (see .env.example) - unset/empty risks silent data loss}/export:/usr/src/paperless/export
      - ${AKTENRAUM_DATA_DIR:?must be set to an absolute path in docker/.env (see .env.example) - unset/empty risks silent data loss}/consume:/usr/src/paperless/consume
      - ./paperless-scripts:/usr/src/paperless/scripts:ro
    env_file:
      - path: .env
        required: false
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: postgres
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_POST_CONSUME_SCRIPT: /usr/src/paperless/scripts/post_consume.sh
      AKTENRAUM_WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    networks:
      - internal

  postgres:
    image: postgres:15@sha256:c2ca90969ca293925ab474466e837689cc712321afdd9e4640bd0cf942fdca3a
    restart: unless-stopped
    volumes:
      - ${AKTENRAUM_DATA_DIR:?must be set to an absolute path in docker/.env (see .env.example) - unset/empty risks silent data loss}/pgdata:/var/lib/postgresql/data
      # Init scripts run only on a fresh data dir; existing installs need to
      # `CREATE DATABASE aktenraum` once by hand (see docs/runbooks/operations.md).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${PAPERLESS_DBNAME:-paperless}
      POSTGRES_USER: ${PAPERLESS_DBUSER:-paperless}
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS:?PAPERLESS_DBPASS is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAPERLESS_DBUSER:-paperless}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7@sha256:33d7c9a245edd95e6703a0addbeaa48fe40c3b3b4783627a72085155462ebfdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  gotenberg:
    # Pinned to the patch version currently running (verified via the
    # org.opencontainers.image.version label). Floating :8 silently
    # tracks any 8.x release; this freezes it.
    image: gotenberg/gotenberg:8.31.0@sha256:f0d86e8a1dbc7b33a5a65cb251d02bb271a48ffa989da3feb5ed7d954fe4d4b3
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    networks:
      - internal

  tika:
    # Pinned to the digest currently running. apache/tika's tag scheme
    # (3.x.y vs YY.MM labels) is ambiguous enough that digest is the
    # only reproducible pin; the tag prefix is documentation, not
    # authoritative. NOTE: stay on apache/tika (not
    # ghcr.io/paperless-ngx/tika — that one requires auth and 403s).
    image: apache/tika:latest@sha256:2a565f1ea1290bdcb74a7d35957d16a989ed44ef98790dcdcc28121d728fa583
    restart: unless-stopped
    mem_limit: ${TIKA_MEM_LIMIT:-2g}
    networks:
      - internal

  qdrant-init:
    image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    command: ["chown", "-R", "1000:1000", "/qdrant/storage"]
    restart: "no"
    volumes:
      - ${AKTENRAUM_DATA_DIR:?must be set to an absolute path in docker/.env (see .env.example) - unset/empty risks silent data loss}/qdrant:/qdrant/storage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    network_mode: none

  qdrant:
    # Vector store for the RAG indexing + retrieval pipeline (RAG Phase 1).
    # REST API on 6333 (used by the Python client we wired in 1.3); gRPC on
    # 6334 stays internal in case a future feature wants the streaming API.
    # 6333 is bound to 127.0.0.1 ONLY so the built-in dashboard at
    # /dashboard is reachable from the dev machine without exposing the
    # vector store to the LAN. Override AKTENRAUM_QDRANT_PORT in docker/.env
    # if 6333 is already in use locally.
    image: qdrant/qdrant:v1.17.1-unprivileged@sha256:9ccb41c57d4297b082bfadeeb985359234c0497e6456a11b824a63a0e7a9cf65
    restart: unless-stopped
    depends_on:
      qdrant-init:
        condition: service_completed_successfully
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required - run scripts/bootstrap-secrets.sh}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${AKTENRAUM_DATA_DIR:?must be set to an absolute path in docker/.env (see .env.example) - unset/empty risks silent data loss}/qdrant:/qdrant/storage
    ports:
      - "127.0.0.1:${AKTENRAUM_QDRANT_PORT:-6333}:6333"
    expose:
      - "6334"
    healthcheck:
      # The qdrant image is debian-slim with bash but no wget/curl. We invoke
      # bash explicitly (CMD form, not CMD-SHELL) because /dev/tcp is a bash
      # built-in and CMD-SHELL would route through dash, which doesn't
      # understand it. Coarser than hitting /readyz over HTTP (a serving-
      # but-misconfigured qdrant looks healthy here) but reliable across
      # image variants without needing to apt-install curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - internal

  auto-tagger:
    build:
      context: ..
      dockerfile: services/auto-tagger/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Cap RAM so a runaway extraction/indexing job can't OOM-kill postgres
    # mid-write. Tune per host via AUTO_TAGGER_MEM_LIMIT.
    mem_limit: ${AUTO_TAGGER_MEM_LIMIT:-3g}
    depends_on:
      paperless:
        condition: service_started
      qdrant:
        condition: service_healthy
      # Soft dependency: the worker boots even if aktenraum-api is still
      # warming up. When unreachable the auto-approve rule fetch fails closed
      # (everything routes to ai-pending) until the cache populates.
      aktenraum-api:
        condition: service_started
    env_file:
      - path: .env
        required: false
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    expose:
      # HTTP listener for paperless's post_consume hook. Internal-network only;
      # never published to the host.
      - "8001"
    networks:
      - internal

  aktenraum-api:
    build:
      context: ..
      dockerfile: services/aktenraum-api/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Cap RAM so a runaway (reranker load + concurrent requests) can't
    # OOM-kill postgres mid-write. Tune per host via AKTENRAUM_API_MEM_LIMIT.
    mem_limit: ${AKTENRAUM_API_MEM_LIMIT:-4g}
    volumes:
      # RAG eval cases. Bind-mounted instead of baked into the image so
      # editing golden-questions.yaml doesn't require a rebuild — the runner
      # re-reads the file on every invocation. Read-only so a buggy runner
      # can never trash the cases.
      - ../evals:/repo/evals:ro
      # transformers.js caches the ONNX reranker here (~571 MB for the q8
      # export). Without the volume every rebuild re-pays the download, and
      # an interrupted rebuild leaves a truncated file that fails at load.
      - aktenraum-node-hf-cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Built from PAPERLESS_DB* above so the DSN is always consistent.
      DATABASE_URL: postgresql://${PAPERLESS_DBUSER:-paperless}:${PAPERLESS_DBPASS}@postgres:5432/aktenraum
      HF_HOME: /home/appuser/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /home/appuser/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    expose:
      - "8002"
    networks:
      - internal

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      aktenraum-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      # Host 8080 → container 8080 (non-root nginx cannot bind 80). Port 80 is often taken on dev machines (eg.
      # by another project's traefik); 8080 is the conventional alternate.
      # Override via AKTENRAUM_WEB_PORT in docker/.env.
      - "127.0.0.1:${AKTENRAUM_WEB_PORT:-8080}:8080"
    networks:
      - internal

  backup:
    build:
      context: ./backup
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 1h
      timeout: 2m
      retries: 1
      start_period: 5m
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    volumes:
      - ${AKTENRAUM_DATA_DIR:?must be set to an absolute path in docker/.env (see .env.example) - unset/empty risks silent data loss}/data:/backup/data:ro
      - ${AKTENRAUM_DATA_DIR:?must be set to an absolute path in docker/.env (see .env.example) - unset/empty risks silent data loss}/media:/backup/media:ro
      - ${AKTENRAUM_DATA_DIR:?must be set to an absolute path in docker/.env (see .env.example) - unset/empty risks silent data loss}/export:/backup/export:ro
      - ${AKTENRAUM_DATA_DIR:?must be set to an absolute path in docker/.env (see .env.example) - unset/empty risks silent data loss}/backup/restic-repo:/repo
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  # Survives `docker compose up -d --build aktenraum-api` so the
  # `onnx-community/bge-reranker-v2-m3-ONNX` q8 export (~571 MB) is
  # downloaded once, not on every rebuild. RetrievalModule pre-warms the
  # model at startup; this volume keeps the bytes on disk. An interrupted
  # rebuild without it leaves a truncated file that fails at load with a
  # protobuf parse error rather than a download error.
  aktenraum-node-hf-cache:
